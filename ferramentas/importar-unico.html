<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script type="module">
  import { sb } from '../js/supabase-client.js';

  const msg = document.getElementById('msg');

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      document.getElementById('msg-no-session').classList.remove('hidden');
      document.getElementById('btn-importar').disabled = true;
    }
  })();

  document.getElementById('btn-importar').addEventListener('click', async () => {
    const btn = document.getElementById('btn-importar');
    btn.disabled = true;
    msg.innerHTML = '';
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('Sessão expirada — faça login de novo.');

      const backup = JSON.parse(document.getElementById('backup-data').textContent);
      const importado = backup.state;
      if (!Array.isArray(importado.visitasPlanejadas)) importado.visitasPlanejadas = [];

      const nome = document.getElementById('nome').value.trim();
      const cliente_nome = document.getElementById('cliente').value.trim();
      const municipio = document.getElementById('municipio').value.trim();
      const proposta = document.getElementById('proposta').value.trim();

      const { data, error } = await sb.from('assessorias').insert({
        owner_id: session.user.id,
        nome,
        cliente_nome: cliente_nome || null,
        municipio: municipio || null,
        proposta: proposta || null,
        data: importado
      }).select().single();
      if (error) throw error;

      msg.innerHTML = `<div class="ok-box">Assessoria criada! Redirecionando para o painel dela...</div>`;
      setTimeout(() => { window.location.href = `../dashboard.html?id=${data.id}`; }, 1200);
    } catch (err) {
      msg.innerHTML = `<div class="error-box">Não foi possível importar: ${err.message}</div>`;
      btn.disabled = false;
    }
  });
</script>
