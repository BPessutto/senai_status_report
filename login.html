<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Painel de Assessorias</title>
<link rel="stylesheet" href="js/shared.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-wrap{width:100%;max-width:380px;padding:0 16px}
  .brand{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
  .brand img{height:36px}
  .card{margin-top:0}
  h1{font-size:18px;text-align:center;color:var(--navy)}
  .sub-login{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:#eef1f5;border-radius:8px;padding:4px}
  .tab-btn{flex:1;border:0;background:transparent;padding:8px;border-radius:6px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
  .tab-btn.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .btn-block{width:100%;justify-content:center;padding:11px}
  .ok-box{background:var(--greenbg);color:var(--green);border:1px solid #cfe6d1;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <img src="assets/logo-senai.png" alt="SENAI">
    <img src="assets/logo-bp.png" alt="B+P">
  </div>
  <div class="card">
    <h1>Painel de Assessorias</h1>
    <div class="sub-login">Acompanhamento de consultorias em andamento</div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-entrar">Entrar</button>
      <button type="button" class="tab-btn" id="tab-criar">Criar conta</button>
    </div>

    <form id="auth-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Entrar</button>
    </form>
    <div id="msg-area"></div>
    <div class="sub-login" id="hint-text" style="margin-top:14px">
      Já é consultor? Use "Entrar". Se você é cliente e recebeu acesso a uma assessoria, crie sua conta com o mesmo e-mail para o qual o convite foi feito.
    </div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module">
  import { sb } from './js/supabase-client.js';

  const form = document.getElementById('auth-form');
  const btnSubmit = document.getElementById('btn-submit');
  const msgArea = document.getElementById('msg-area');
  const tabEntrar = document.getElementById('tab-entrar');
  const tabCriar = document.getElementById('tab-criar');
  let mode = 'entrar';

  function setMode(next){
    mode = next;
    tabEntrar.classList.toggle('active', mode === 'entrar');
    tabCriar.classList.toggle('active', mode === 'criar');
    btnSubmit.textContent = mode === 'entrar' ? 'Entrar' : 'Criar conta';
    msgArea.innerHTML = '';
  }
  tabEntrar.addEventListener('click', () => setMode('entrar'));
  tabCriar.addEventListener('click', () => setMode('criar'));

  function showError(text){
    msgArea.innerHTML = `<div class="error-box">${text}</div>`;
  }
  function showOk(text){
    msgArea.innerHTML = `<div class="ok-box">${text}</div>`;
  }

  // Se já existe sessão válida, pula direto pro painel.
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'painel.html';
  })();

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msgArea.innerHTML = '';
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    btnSubmit.disabled = true;

    try {
      if (mode === 'entrar') {
        const { error } = await sb.auth.signInWithPassword({ email, password: senha });
        if (error) throw error;
        window.location.href = 'painel.html';
      } else {
        const { data, error } = await sb.auth.signUp({ email, password: senha });
        if (error) throw error;
        if (data.session) {
          window.location.href = 'painel.html';
        } else {
          showOk('Conta criada! Verifique seu e-mail para confirmar o cadastro e depois faça login.');
        }
      }
    } catch (err) {
      showError(err.message || 'Não foi possível concluir. Confira os dados e tente novamente.');
    } finally {
      btnSubmit.disabled = false;
    }
  });
</script>
</body>
</html>
