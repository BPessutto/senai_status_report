<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Gerencial</title>
<link rel="stylesheet" href="js/shared.css">
<style>
  .header-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .grid{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .consultor-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;display:grid;grid-template-columns:190px 1fr 1fr 190px;gap:22px;align-items:start;cursor:pointer;text-align:left;font-family:inherit;color:inherit;width:100%}
  .consultor-card:hover{filter:brightness(.98)}
  .consultor-card h3{margin:0;font-size:15px;color:var(--navy)}
  .consultor-card .consultor-email{font-size:11px;color:var(--muted);margin-bottom:8px}
  .consultor-main{display:flex;flex-direction:column;gap:8px;min-width:0}
  .consultor-col{border-left:1px solid var(--border);padding-left:22px;min-width:0}
  .status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:var(--radius-pill);width:fit-content}
  .status-badge i{display:inline-block;width:8px;height:8px;border-radius:50%}
  .status-visita{background:var(--greenbg);color:var(--green)}
  .status-visita i{background:var(--green)}
  .status-planejado{background:#dbeafe;color:#1d4ed8}
  .status-planejado i{background:#1d4ed8}
  .status-compensando{background:#ede9fe;color:#6d28d9}
  .status-compensando i{background:#6d28d9}
  .status-livre{background:#eef1f5;color:var(--muted)}
  .status-livre i{background:var(--muted)}
  .consultor-count{font-size:11px;color:var(--muted)}
  .metric-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
  .metric-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text);margin-bottom:2px}
  .metric-row span{color:var(--muted)}
  .ocup-alta{color:var(--danger);font-weight:800}
  .ocup-ok{color:var(--green);font-weight:800}
  .ocup-baixa{color:var(--amber);font-weight:800}
  .saldo-devedor{color:var(--danger);font-weight:800}
  .consultor-alertas{grid-column:1 / -1;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
  .alerta-item{font-size:11px;color:var(--danger);font-weight:700;margin-bottom:5px;line-height:1.4}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .meter-row{margin-bottom:8px}
  .meter-row:last-child{margin-bottom:0}
  .meter-label{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}
  .meter-label strong{color:var(--text);font-weight:800}
  .meter-track{height:7px;background:#eef1f5;border-radius:999px;overflow:hidden}
  .meter-fill{height:100%;border-radius:999px}
  .meter-fill.ocup-alta{background:var(--danger)}
  .meter-fill.ocup-ok{background:var(--green)}
  .meter-fill.ocup-baixa{background:var(--amber)}
  .compare-legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-bottom:8px}
  .compare-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend-planejado{background:var(--blue)}
  .legend-registrado{background:var(--green)}
  .compare-groups{display:flex;gap:18px}
  .compare-group{flex:1;min-width:0}
  .compare-group-label{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .compare-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .compare-bar-row:last-child{margin-bottom:0}
  .compare-track{flex:1;height:7px;background:#eef1f5;border-radius:999px;overflow:hidden;min-width:0}
  .compare-fill{height:100%;border-radius:999px}
  .compare-fill-planejado{background:var(--blue)}
  .compare-fill-registrado{background:var(--green)}
  .compare-value{font-size:10.5px;color:var(--text);font-weight:700;width:38px;text-align:right;flex-shrink:0}
  @media(max-width:860px){
    .consultor-card{grid-template-columns:1fr}
    .consultor-col{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo-group">
        <div class="logo-box logo-senai"><img src="assets/logo-senai.png" alt="SENAI"></div>
      </div>
      <div class="title-block">
        <div class="eyebrow">ACOMPANHAMENTO DE CONSULTORIAS</div>
        <h1>Cronogramas e Painel de Assessorias</h1>
        <div class="sub" id="user-email"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-logout">Sair</button>
    </div>
  </header>

  <div id="grid" class="grid"></div>
  <div id="empty-state" class="empty-state hidden"></div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module">
  import { sb } from './js/supabase-client.js';
  import { requireSession, logout } from './js/session.js';
  import { todayISO, fmtDateBR, addDaysISO } from './js/calendar-utils.js';
  import { computeFasePrevisoes, PRAZO_APONTAMENTO_DIAS, PRAZO_ENCERRAMENTO_DIAS } from './js/stage-template.js';

  const OCUPACAO_META_MENSAL = 144; // horas/mês = 100% do indicador de ocupação do BI

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');

  document.getElementById('btn-logout').addEventListener('click', logout);

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function round1(x){ return Math.round(Number(x||0) * 10) / 10; }

  // Segunda-feira da semana que contém "hoje" (ISO), em UTC.
  function segundaDaSemana(hoje){
    const [y,m,d] = hoje.split('-').map(Number);
    const diaSemana = new Date(Date.UTC(y, m-1, d)).getUTCDay(); // 0=dom..6=sáb
    const voltar = diaSemana === 0 ? 6 : diaSemana - 1;
    return addDaysISO(hoje, -voltar);
  }

  function statusBadgeHtml(status){
    if (status.tipo === 'visita') return `<span class="status-badge status-visita"><i></i>Em visita — ${escapeHtml(status.empresa)} (${status.horas}h)</span>`;
    if (status.tipo === 'planejado') return `<span class="status-badge status-planejado"><i></i>Planejado — ${escapeHtml(status.empresa)} (${status.horas}h)</span>`;
    if (status.tipo === 'compensando') return `<span class="status-badge status-compensando"><i></i>Compensando hoje (${status.horas}h)</span>`;
    return `<span class="status-badge status-livre"><i></i>Sem atividade hoje</span>`;
  }

  function ocupacaoClass(pct){
    if (pct > 100) return 'ocup-alta';
    if (pct >= 85) return 'ocup-ok';
    return 'ocup-baixa';
  }

  function metricRowHtml(label, value, cls){
    return `<div class="metric-row"><span>${label}</span><strong class="${cls || ''}">${value}</strong></div>`;
  }

  // Barra de progresso até a meta (ex.: ocupação do mês), com cor de status
  // (verde/âmbar/vermelho) igual ao indicador numérico que ela substitui.
  function meterRowHtml(label, pct, valueLabel){
    const cls = ocupacaoClass(pct);
    const largura = Math.min(100, Math.max(0, pct));
    return `
      <div class="meter-row">
        <div class="meter-label"><span>${label}</span><strong class="${cls}">${valueLabel}</strong></div>
        <div class="meter-track"><div class="meter-fill ${cls}" style="width:${largura}%"></div></div>
      </div>`;
  }

  // Par de barras (Planejado x Registrado) com escala local ao grupo, pra
  // sempre mostrar as duas barras com um comprimento legível.
  function comparePairHtml(label, planejado, registrado){
    const max = Math.max(planejado, registrado, 1);
    const wP = Math.min(100, round1((planejado / max) * 100));
    const wR = Math.min(100, round1((registrado / max) * 100));
    return `
      <div class="compare-group">
        <div class="compare-group-label">${label}</div>
        <div class="compare-bar-row"><div class="compare-track"><div class="compare-fill compare-fill-planejado" style="width:${wP}%"></div></div><span class="compare-value">${planejado}h</span></div>
        <div class="compare-bar-row"><div class="compare-track"><div class="compare-fill compare-fill-registrado" style="width:${wR}%"></div></div><span class="compare-value">${registrado}h</span></div>
      </div>`;
  }

  // Junta tudo que o card de um consultor precisa mostrar: status de hoje,
  // ocupação do mês (planejada x registrada, meta de 144h), comparação
  // planejado x registrado (semana e mês), banco de horas de deslocamento e
  // alertas de prazo (1º apontamento, encerramento, fases furadas).
  function computeConsultorMetrics(consultorId, todasAssessorias, compensacoesTodas, hoje){
    const doConsultor = todasAssessorias.filter(a => a.owner_id === consultorId);
    const ativas = doConsultor.filter(a => a.ativo !== false);
    const compensacoes = compensacoesTodas.filter(c => c.owner_id === consultorId);

    const mesAtual = hoje.slice(0, 7);
    const semanaInicio = segundaDaSemana(hoje);
    const semanaFim = addDaysISO(semanaInicio, 6);

    let hojeInfo = { tipo: 'livre', empresa: null, horas: 0 };
    for (const a of ativas) {
      const v = ((a.data && a.data.visitas) || []).find(x => x.dataISO === hoje);
      if (v) { hojeInfo = { tipo: 'visita', empresa: a.cliente_nome || a.nome, horas: round1(v.horasNoDia) }; break; }
    }
    if (hojeInfo.tipo === 'livre') {
      for (const a of ativas) {
        const p = ((a.data && a.data.visitasPlanejadas) || []).find(x => x.dataISO === hoje);
        if (p) { hojeInfo = { tipo: 'planejado', empresa: a.cliente_nome || a.nome, horas: round1(p.horas) }; break; }
      }
    }
    if (hojeInfo.tipo === 'livre') {
      const comp = compensacoes.find(c => c.data_iso === hoje);
      if (comp) hojeInfo = { tipo: 'compensando', empresa: null, horas: round1(comp.horas || 8) };
    }

    let planejadoSemana = 0, registradoSemana = 0, planejadoMes = 0, registradoMes = 0;
    ativas.forEach(a => {
      const d = a.data || {};
      (d.visitasPlanejadas || []).forEach(p => {
        const h = Number(p.horas || 0);
        if (p.dataISO >= semanaInicio && p.dataISO <= semanaFim) planejadoSemana += h;
        if (p.dataISO && p.dataISO.slice(0, 7) === mesAtual) planejadoMes += h;
      });
      (d.visitas || []).forEach(v => {
        const h = Number(v.horasNoDia || 0);
        if (v.dataISO >= semanaInicio && v.dataISO <= semanaFim) registradoSemana += h;
        if (v.dataISO && v.dataISO.slice(0, 7) === mesAtual) registradoMes += h;
      });
    });

    const ocupacaoPlanejada = round1((planejadoMes / OCUPACAO_META_MENSAL) * 100);
    const ocupacaoRegistrada = round1((registradoMes / OCUPACAO_META_MENSAL) * 100);

    // Banco de horas de deslocamento: histórico completo (ativas + arquivadas),
    // mesma lógica do painel do consultor.
    let deslocGeradoTotal = 0, deslocGeradoMes = 0;
    doConsultor.forEach(a => {
      ((a.data && a.data.visitas) || []).forEach(v => {
        const h = Number(v.deslocamentoHoras || 0);
        if (h > 0) {
          deslocGeradoTotal += h;
          if (v.dataISO && v.dataISO.slice(0, 7) === mesAtual) deslocGeradoMes += h;
        }
      });
    });
    let compensadoTotal = 0, compensadoMes = 0;
    compensacoes.forEach(c => {
      const h = Number(c.horas || 8);
      compensadoTotal += h;
      if (c.data_iso && c.data_iso.slice(0, 7) === mesAtual) compensadoMes += h;
    });
    const saldoBanco = round1(Math.max(0, deslocGeradoTotal - compensadoTotal));

    const alertas = [];
    ativas.forEach(a => {
      const d = a.data || {};
      const nomeEmpresa = a.cliente_nome || a.nome;
      const primeiraVisita = (d.visitas || []).map(v => v.dataISO).sort()[0] || null;

      if (a.data_contratacao) {
        const prazoApontamento = addDaysISO(a.data_contratacao, PRAZO_APONTAMENTO_DIAS);
        if (!primeiraVisita && hoje > prazoApontamento) {
          alertas.push(`${nomeEmpresa}: 1º apontamento atrasado (prazo era ${fmtDateBR(prazoApontamento)})`);
        }
        const prazoEncerramentoAuto = addDaysISO(primeiraVisita || a.data_contratacao, PRAZO_ENCERRAMENTO_DIAS);
        const prazoEncerramento = a.prazo_encerramento_manual || prazoEncerramentoAuto;
        const totalReal = (d.etapas || []).reduce((s, e) => s + Number(e.real || 0), 0);
        const concluido = d.totalPrevisto > 0 && totalReal >= d.totalPrevisto;
        if (!concluido && hoje > prazoEncerramento) {
          alertas.push(`${nomeEmpresa}: prazo de encerramento vencido (${fmtDateBR(prazoEncerramento)})`);
        }
      }

      if (d.etapas && d.etapas.length) {
        const safeState = { visitas: d.visitas || [], visitasPlanejadas: d.visitasPlanejadas || [], etapas: d.etapas };
        const { porFase } = computeFasePrevisoes(safeState);
        porFase.forEach(p => {
          if (p.status === 'estimada' && p.dataPrevista && p.dataPrevista < hoje) {
            const etapa = d.etapas.find(e => e.id === p.etapaId);
            alertas.push(`${nomeEmpresa}: ${etapa ? etapa.curto : p.etapaId} prevista para ${fmtDateBR(p.dataPrevista)}, ainda não concluída`);
          }
        });
      }
    });

    return {
      hoje: hojeInfo,
      assessoriaCount: ativas.length,
      planejadoSemana: round1(planejadoSemana), registradoSemana: round1(registradoSemana),
      planejadoMes: round1(planejadoMes), registradoMes: round1(registradoMes),
      ocupacaoPlanejada, ocupacaoRegistrada,
      deslocGeradoMes: round1(deslocGeradoMes), compensadoMes: round1(compensadoMes), saldoBanco,
      alertas
    };
  }

  function renderCard(consultor, m){
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'consultor-card';
    const alertasHtml = m.alertas.length
      ? `<div class="consultor-alertas">${m.alertas.map(a => `<div class="alerta-item">⚠ ${escapeHtml(a)}</div>`).join('')}</div>`
      : '';
    card.innerHTML = `
      <div class="consultor-main">
        <div>
          <h3>${escapeHtml(consultor.nome || consultor.email)}</h3>
          <div class="consultor-email">${escapeHtml(consultor.email || '')}</div>
        </div>
        ${statusBadgeHtml(m.hoje)}
        <div class="consultor-count">${m.assessoriaCount} assessoria(s) ativa(s)</div>
      </div>
      <div class="consultor-col">
        <div class="metric-title">Ocupação do mês (meta ${OCUPACAO_META_MENSAL}h)</div>
        ${meterRowHtml('Planejada', m.ocupacaoPlanejada, `${m.ocupacaoPlanejada}% (${m.planejadoMes}h)`)}
        ${meterRowHtml('Registrada', m.ocupacaoRegistrada, `${m.ocupacaoRegistrada}% (${m.registradoMes}h)`)}
      </div>
      <div class="consultor-col">
        <div class="metric-title">Planejado × Registrado</div>
        <div class="compare-legend"><span><i class="legend-planejado"></i>Planejado</span><span><i class="legend-registrado"></i>Registrado</span></div>
        <div class="compare-groups">
          ${comparePairHtml('Semana atual', m.planejadoSemana, m.registradoSemana)}
          ${comparePairHtml('Mês atual', m.planejadoMes, m.registradoMes)}
        </div>
      </div>
      <div class="consultor-col">
        <div class="metric-title">Banco de horas (deslocamento)</div>
        ${metricRowHtml('Gerado no mês', `${m.deslocGeradoMes}h`)}
        ${metricRowHtml('Compensado no mês', `${m.compensadoMes}h`)}
        ${metricRowHtml('Saldo acumulado', `${m.saldoBanco}h`, m.saldoBanco > 0 ? 'saldo-devedor' : '')}
      </div>
      ${alertasHtml}
    `;
    card.addEventListener('click', () => {
      window.location.href = `painel.html?as=${consultor.id}`;
    });
    return card;
  }

  async function carregar(){
    const { data: consultores, error: errPerfis } = await sb.from('profiles')
      .select('id,nome,email')
      .eq('role', 'consultor')
      .order('nome', { ascending: true });
    if (errPerfis) {
      emptyState.textContent = 'Não foi possível carregar os consultores: ' + errPerfis.message;
      emptyState.classList.remove('hidden');
      return;
    }
    if (!consultores || !consultores.length) {
      emptyState.textContent = 'Nenhum consultor cadastrado ainda.';
      emptyState.classList.remove('hidden');
      return;
    }

    const { data: assessorias } = await sb.from('assessorias')
      .select('owner_id,nome,cliente_nome,ativo,data,data_contratacao,prazo_encerramento_manual');
    const { data: compensacoes } = await sb.from('compensacoes').select('owner_id,data_iso,horas');
    const hoje = todayISO();

    grid.innerHTML = '';
    consultores.forEach(consultor => {
      const m = computeConsultorMetrics(consultor.id, assessorias || [], compensacoes || [], hoje);
      grid.appendChild(renderCard(consultor, m));
    });
  }

  (async () => {
    const session = await requireSession();
    if (!session) return;

    const { data: perfil } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    if (!perfil || perfil.role !== 'gestor') {
      window.location.href = 'painel.html';
      return;
    }

    document.getElementById('user-email').textContent = session.user.email;
    carregar();
  })();
</script>
</body>
</html>
