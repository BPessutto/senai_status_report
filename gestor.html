<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Gerencial</title>
<link rel="stylesheet" href="js/shared.css">
<style>
  .header-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
  .consultor-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
  .consultor-card:hover{filter:brightness(.98)}
  .consultor-card h3{margin:0;font-size:15px;color:var(--navy)}
  .consultor-card .consultor-email{font-size:11px;color:var(--muted)}
  .status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:var(--radius-pill);width:fit-content}
  .status-badge i{display:inline-block;width:8px;height:8px;border-radius:50%}
  .status-visita{background:var(--greenbg);color:var(--green)}
  .status-visita i{background:var(--green)}
  .status-planejado{background:#dbeafe;color:#1d4ed8}
  .status-planejado i{background:#1d4ed8}
  .status-compensando{background:#ede9fe;color:#6d28d9}
  .status-compensando i{background:#6d28d9}
  .status-livre{background:#eef1f5;color:var(--muted)}
  .status-livre i{background:var(--muted)}
  .consultor-detalhe{font-size:12px;color:var(--muted)}
  .consultor-count{font-size:11px;color:var(--muted)}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo-group">
        <div class="logo-box logo-senai"><img src="assets/logo-senai.png" alt="SENAI"></div>
      </div>
      <div class="title-block">
        <div class="eyebrow">ACOMPANHAMENTO DE CONSULTORIAS</div>
        <h1>Cronogramas e Painel de Assessorias</h1>
        <div class="sub" id="user-email"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-logout">Sair</button>
    </div>
  </header>

  <div id="grid" class="grid"></div>
  <div id="empty-state" class="empty-state hidden"></div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module">
  import { sb } from './js/supabase-client.js';
  import { requireSession, logout } from './js/session.js';
  import { todayISO } from './js/calendar-utils.js';

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');

  document.getElementById('btn-logout').addEventListener('click', logout);

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Status do dia de um consultor: olha as assessorias ativas dele em busca de
  // visita realizada hoje, senão visita planejada hoje, senão compensação hoje.
  function statusHoje(consultorId, assessorias, compensacoes, hoje){
    const doConsultor = assessorias.filter(a => a.owner_id === consultorId && a.ativo !== false);
    for (const a of doConsultor) {
      const d = a.data || {};
      const realizada = (d.visitas || []).find(v => v.dataISO === hoje);
      if (realizada) return { tipo: 'visita', empresa: a.cliente_nome || a.nome, assessoriaCount: doConsultor.length };
    }
    for (const a of doConsultor) {
      const d = a.data || {};
      const planejada = (d.visitasPlanejadas || []).find(p => p.dataISO === hoje);
      if (planejada) return { tipo: 'planejado', empresa: a.cliente_nome || a.nome, assessoriaCount: doConsultor.length };
    }
    const compensando = compensacoes.find(c => c.owner_id === consultorId && c.data_iso === hoje);
    if (compensando) return { tipo: 'compensando', empresa: null, assessoriaCount: doConsultor.length };
    return { tipo: 'livre', empresa: null, assessoriaCount: doConsultor.length };
  }

  function statusBadgeHtml(status){
    if (status.tipo === 'visita') return `<span class="status-badge status-visita"><i></i>Em visita — ${escapeHtml(status.empresa)}</span>`;
    if (status.tipo === 'planejado') return `<span class="status-badge status-planejado"><i></i>Planejado — ${escapeHtml(status.empresa)}</span>`;
    if (status.tipo === 'compensando') return `<span class="status-badge status-compensando"><i></i>Compensando hoje</span>`;
    return `<span class="status-badge status-livre"><i></i>Sem atividade hoje</span>`;
  }

  function renderCard(consultor, status){
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'consultor-card';
    card.innerHTML = `
      <div>
        <h3>${escapeHtml(consultor.nome || consultor.email)}</h3>
        <div class="consultor-email">${escapeHtml(consultor.email || '')}</div>
      </div>
      ${statusBadgeHtml(status)}
      <div class="consultor-count">${status.assessoriaCount} assessoria(s) ativa(s)</div>
    `;
    card.addEventListener('click', () => {
      window.location.href = `painel.html?as=${consultor.id}`;
    });
    return card;
  }

  async function carregar(){
    const { data: consultores, error: errPerfis } = await sb.from('profiles')
      .select('id,nome,email')
      .eq('role', 'consultor')
      .order('nome', { ascending: true });
    if (errPerfis) {
      emptyState.textContent = 'Não foi possível carregar os consultores: ' + errPerfis.message;
      emptyState.classList.remove('hidden');
      return;
    }
    if (!consultores || !consultores.length) {
      emptyState.textContent = 'Nenhum consultor cadastrado ainda.';
      emptyState.classList.remove('hidden');
      return;
    }

    const { data: assessorias } = await sb.from('assessorias').select('owner_id,nome,cliente_nome,ativo,data');
    const { data: compensacoes } = await sb.from('compensacoes').select('owner_id,data_iso');
    const hoje = todayISO();

    grid.innerHTML = '';
    consultores.forEach(consultor => {
      const status = statusHoje(consultor.id, assessorias || [], compensacoes || [], hoje);
      grid.appendChild(renderCard(consultor, status));
    });
  }

  (async () => {
    const session = await requireSession();
    if (!session) return;

    const { data: perfil } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    if (!perfil || perfil.role !== 'gestor') {
      window.location.href = 'painel.html';
      return;
    }

    document.getElementById('user-email').textContent = session.user.email;
    carregar();
  })();
</script>
</body>
</html>
