<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Assessorias</title>
</head>
<body>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module">
  import { sb } from './js/supabase-client.js';
  import { urlIndicaRecovery } from './js/session.js';

  // Link de recuperação de senha caindo aqui (ex.: Site URL do Supabase
  // configurado pra raiz do app) nunca deve virar login automático.
  if (urlIndicaRecovery()) {
    window.location.href = 'redefinir-senha.html' + window.location.search + window.location.hash;
  } else {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
    } else {
      // Consultor e gestor seguem pro fluxo de sempre (painel.html decide o
      // resto, incluindo mandar o gestor pra gestor.html); só o apoio ganha
      // destino direto.
      const { data: perfil } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
      window.location.href = (perfil && perfil.role === 'apoio') ? 'apoio.html' : 'painel.html';
    }
  }
</script>
</body>
</html>
