<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Assessorias</title>
<link rel="stylesheet" href="js/shared.css">
<style>
  .header-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
  .assessoria-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .assessoria-card h3{margin:0;font-size:15px;color:var(--navy)}
  .assessoria-card .cliente{font-size:12px;color:var(--muted)}
  .bar-track{height:9px;background:#eef1f5;border-radius:var(--radius-pill);overflow:hidden}
  .bar-fill{height:100%;background:var(--blue);border-radius:var(--radius-pill)}
  .pct-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .btn-sm{padding:7px 10px;font-size:11.5px}
  .client-panel{border-top:1px dashed var(--border);padding-top:10px;margin-top:2px;display:none}
  .client-panel.open{display:block}
  .client-email-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f4f8}
  .client-email-row:last-child{border-bottom:0}
  .link-btn{border:0;background:none;color:var(--danger);font-size:11px;font-weight:700;cursor:pointer}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal-box{background:#fff;border-radius:var(--radius);padding:20px;max-width:420px;width:100%}
  .modal-box h2{margin:0 0 14px;font-size:15px;color:var(--navy)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .role-tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .cal-year-nav{display:flex;align-items:center;gap:8px;text-transform:none;font-size:12px;color:var(--navy);font-weight:800}
  .cal-legenda-consolidado{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px}
  .cal-legenda-consolidado i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .cal-meses-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .cal-month{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fbfcfe}
  .cal-month-title{font-weight:800;color:var(--navy);text-align:center;margin-bottom:8px;font-size:13px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-grid-head{margin-bottom:4px}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;color:var(--text)}
  .cal-head{font-weight:800;font-size:9.5px;color:var(--muted);text-transform:uppercase;aspect-ratio:auto}
  .cal-empty{background:transparent}
  .cal-today{outline:2px solid var(--blue);outline-offset:-2px;font-weight:800}
  .cal-compensacao{background:#ede9fe;color:#6d28d9;cursor:pointer;font-weight:700}
  .cal-cell:not(.cal-empty):not(.cal-head):hover{filter:brightness(.95)}
  .cal-cell[data-clickable]{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo-group">
        <div class="logo-box logo-senai"><img src="assets/logo-senai.png" alt="SENAI"></div>
      </div>
      <div class="title-block">
        <div class="eyebrow">ACOMPANHAMENTO DE CONSULTORIAS</div>
        <h1 id="page-title">Minhas Assessorias</h1>
        <div class="sub" id="user-email"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary hidden" id="btn-nova">+ Nova assessoria</button>
      <button class="btn btn-ghost" id="btn-logout">Sair</button>
    </div>
  </header>

  <div id="grid" class="grid"></div>
  <div id="empty-state" class="empty-state hidden"></div>

  <div class="card hidden" id="calendario-card">
    <div class="card-title">
      <span>Calendário geral</span>
      <div class="cal-year-nav">
        <button type="button" class="btn btn-sm" id="btn-ano-anterior">‹</button>
        <span id="ano-atual-label"></span>
        <button type="button" class="btn btn-sm" id="btn-ano-seguinte">›</button>
      </div>
    </div>
    <div id="calendario-legenda" class="cal-legenda-consolidado"></div>
    <div id="calendario-meses" class="cal-meses-grid"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="modal-nova">
  <div class="modal-box">
    <h2 id="modal-nova-titulo">Nova assessoria</h2>
    <form id="form-nova">
      <div class="field">
        <label for="nova-nome">Nome do projeto</label>
        <input type="text" id="nova-nome" required placeholder="Ex.: Projeto Lean — Empresa XPTO">
      </div>
      <div class="field">
        <label for="nova-cliente">Nome do cliente / empresa</label>
        <input type="text" id="nova-cliente" placeholder="Ex.: XPTO Indústria Ltda.">
      </div>
      <div class="field">
        <label for="nova-municipio">Local / Município</label>
        <input type="text" id="nova-municipio" placeholder="Ex.: Ribeirão Preto - SP">
      </div>
      <div class="field">
        <label for="nova-proposta">Nº da proposta (opcional)</label>
        <input type="text" id="nova-proposta" placeholder="Ex.: 186/2026">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btn-cancelar-nova">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-salvar-nova">Criar assessoria</button>
      </div>
    </form>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module">
  import { sb } from './js/supabase-client.js';
  import { requireSession, logout } from './js/session.js';
  import { defaultState } from './js/stage-template.js';
  import { WEEKDAY_LABELS, MONTH_NAMES, todayISO, fmtDateBR, buildMonthGrid, parseBRDateToISO, colorForIndex } from './js/calendar-utils.js';
  import { showActionPanel } from './js/action-panel.js';

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');
  const btnNova = document.getElementById('btn-nova');

  function escapeAttr(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('btn-logout').addEventListener('click', logout);

  function fmtPct(x){ return (x*100).toFixed(1).replace('.', ','); }
  function computeProgress(data){
    const etapas = Array.isArray(data && data.etapas) ? data.etapas : [];
    const totalPrevisto = Number(data && data.totalPrevisto) || 0;
    const totalReal = etapas.reduce((s,e) => s + Number(e.real || 0), 0);
    return totalPrevisto > 0 ? totalReal / totalPrevisto : 0;
  }
  function currentStatus(data){
    const etapas = Array.isArray(data && data.etapas) ? data.etapas : [];
    const visitas = Array.isArray(data && data.visitas) ? data.visitas : [];
    const lv = visitas.length ? visitas[visitas.length - 1] : null;
    if (lv && lv.status) return lv.status;
    const firstOpen = etapas.find(e => e.status !== 'Concluído');
    return firstOpen ? firstOpen.status : 'Não iniciado';
  }

  let session = null;
  let isOwnerOfSomething = false;
  let editingAssessoriaId = null;

  function openEditModal(row){
    editingAssessoriaId = row.id;
    document.getElementById('modal-nova-titulo').textContent = 'Editar assessoria';
    document.getElementById('btn-salvar-nova').textContent = 'Salvar alterações';
    document.getElementById('nova-nome').value = row.nome || '';
    document.getElementById('nova-cliente').value = row.cliente_nome || '';
    document.getElementById('nova-municipio').value = row.municipio || '';
    document.getElementById('nova-proposta').value = row.proposta || '';
    document.getElementById('modal-nova').classList.remove('hidden');
  }

  function closeNovaModal(){
    editingAssessoriaId = null;
    document.getElementById('modal-nova-titulo').textContent = 'Nova assessoria';
    document.getElementById('btn-salvar-nova').textContent = 'Criar assessoria';
    document.getElementById('form-nova').reset();
    document.getElementById('modal-nova').classList.add('hidden');
  }

  async function loadClientEmails(assessoriaId, listEl){
    const { data, error } = await sb.from('assessoria_clientes').select('*').eq('assessoria_id', assessoriaId).order('created_at');
    if (error) { listEl.innerHTML = `<div class="muted">Não foi possível carregar.</div>`; return; }
    if (!data.length) { listEl.innerHTML = `<div class="muted">Nenhum cliente com acesso ainda.</div>`; return; }
    listEl.innerHTML = data.map(c => `
      <div class="client-email-row">
        <span>${c.email}</span>
        <button type="button" class="link-btn" data-remove-client="${c.id}">remover</button>
      </div>`).join('');
    listEl.querySelectorAll('[data-remove-client]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await sb.from('assessoria_clientes').delete().eq('id', btn.dataset.removeClient);
        loadClientEmails(assessoriaId, listEl);
      });
    });
  }

  function renderCard(row){
    const isOwner = row.owner_id === session.user.id;
    const pct = computeProgress(row.data);
    const status = currentStatus(row.data);
    const card = document.createElement('div');
    card.className = 'assessoria-card';
    card.innerHTML = `
      <div>
        <span class="role-tag">${isOwner ? 'Você é o consultor' : 'Acesso de cliente (somente leitura)'}</span>
        <h3>${row.nome}</h3>
        <div class="cliente">${row.cliente_nome || '—'}${row.municipio ? ' · ' + row.municipio : ''}${row.proposta ? ' · Proposta ' + row.proposta : ''}</div>
      </div>
      <div>
        <div class="pct-row"><span>Progresso</span><strong>${fmtPct(pct)}%</strong></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,pct*100)).toFixed(1)}%"></div></div>
        <div class="pct-row" style="margin-top:6px"><span>Status</span><span>${status}</span></div>
      </div>
      <div class="card-actions">
        <a class="btn btn-primary btn-sm" href="dashboard.html?id=${row.id}">Abrir painel</a>
        ${isOwner ? `<button type="button" class="btn btn-sm" data-editar="${row.id}">✎ Editar</button>` : ''}
        ${isOwner ? `<button type="button" class="btn btn-sm" data-toggle-clients="${row.id}">Compartilhar com cliente</button>` : ''}
      </div>
      ${isOwner ? `
      <div class="client-panel" id="clients-${row.id}">
        <div class="field">
          <label>E-mail do cliente autorizado</label>
          <div style="display:flex;gap:6px">
            <input type="email" id="input-client-${row.id}" placeholder="cliente@empresa.com" style="flex:1">
            <button type="button" class="btn btn-sm" data-add-client="${row.id}">Convidar</button>
          </div>
        </div>
        <div id="list-clients-${row.id}"></div>
      </div>` : ''}
    `;

    if (isOwner) {
      card.querySelector(`[data-editar="${row.id}"]`).addEventListener('click', () => openEditModal(row));
      const toggleBtn = card.querySelector(`[data-toggle-clients="${row.id}"]`);
      const panel = card.querySelector(`#clients-${row.id}`);
      const listEl = card.querySelector(`#list-clients-${row.id}`);
      toggleBtn.addEventListener('click', () => {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) loadClientEmails(row.id, listEl);
      });
      card.querySelector(`[data-add-client="${row.id}"]`).addEventListener('click', async () => {
        const input = card.querySelector(`#input-client-${row.id}`);
        const email = input.value.trim();
        if (!email) return;
        const { error } = await sb.from('assessoria_clientes').insert({ assessoria_id: row.id, email });
        if (error) { alert('Não foi possível adicionar: ' + error.message); return; }
        input.value = '';
        loadClientEmails(row.id, listEl);
      });
    }
    return card;
  }

  async function loadAssessorias(){
    const { data, error } = await sb.from('assessorias').select('*').order('created_at', { ascending: false });
    if (error) {
      emptyState.textContent = 'Não foi possível carregar suas assessorias: ' + error.message;
      emptyState.classList.remove('hidden');
      return;
    }
    isOwnerOfSomething = data.some(r => r.owner_id === session.user.id);
    // Sem nenhuma assessoria ainda não dá pra saber se é o consultor (primeiro acesso)
    // ou um cliente sem convite — nesse caso deixamos o botão de criar visível também.
    btnNova.classList.toggle('hidden', !isOwnerOfSomething && data.length > 0);

    // Cliente com acesso a exatamente uma assessoria: pula direto pro painel dela.
    if (!isOwnerOfSomething && data.length === 1) {
      window.location.href = `dashboard.html?id=${data[0].id}`;
      return;
    }

    if (!data.length) {
      emptyState.innerHTML = 'Nenhuma assessoria encontrada. Clique em "+ Nova assessoria" acima para criar a primeira — ou, se você é cliente, peça ao seu consultor para liberar o acesso usando este mesmo e-mail.';
      emptyState.classList.remove('hidden');
      grid.innerHTML = '';
      return;
    }
    emptyState.classList.add('hidden');
    grid.innerHTML = '';
    data.forEach(row => grid.appendChild(renderCard(row)));

    const calendarioCard = document.getElementById('calendario-card');
    if (isOwnerOfSomething) {
      ownedAssessoriasSorted = data
        .filter(r => r.owner_id === session.user.id)
        .sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)));
      colorMap = new Map(ownedAssessoriasSorted.map((r,i) => [r.id, i]));
      calendarioCard.classList.remove('hidden');
      const { data: comp } = await sb.from('compensacoes').select('*').eq('owner_id', session.user.id);
      compensacoesList = comp || [];
      renderCalendario();
    } else {
      calendarioCard.classList.add('hidden');
    }
  }

  // ============================================================
  // Calendário geral (consolidado de todas as assessorias)
  // ============================================================
  let ownedAssessoriasSorted = [];
  let colorMap = new Map();
  let compensacoesList = [];
  let calendarYear = new Date().getFullYear();

  function consolidatedDayInfo(iso){
    for (const a of ownedAssessoriasSorted) {
      const d = a.data || {};
      const actual = (d.visitas||[]).filter(v => v.dataISO === iso).reduce((s,v) => s + Number(v.horasNoDia||0), 0);
      if (actual > 0) return { assessoria: a, tipo: 'realizada', horas: actual };
      const planejada = (d.visitasPlanejadas||[]).find(p => p.dataISO === iso);
      if (planejada) return { assessoria: a, tipo: 'planejada', horas: planejada.horas, entrada: planejada };
    }
    return null;
  }

  function compensacaoNoDia(iso){
    return compensacoesList.find(c => c.data_iso === iso) || null;
  }

  function renderMesConsolidado(year, month){
    const cells = buildMonthGrid(year, month);
    const today = todayISO();
    const cellsHtml = cells.map(d => {
      if (d === null) return `<div class="cal-cell cal-empty"></div>`;
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = consolidatedDayInfo(iso);
      const comp = !info ? compensacaoNoDia(iso) : null;
      const isToday = iso === today;
      let style = '', title = '', cls = 'cal-cell' + (isToday ? ' cal-today' : '');
      if (info) {
        const cor = colorForIndex(colorMap.get(info.assessoria.id) || 0);
        style = `style="background:${cor}26;color:${cor};font-weight:700"`;
        const totalPrevisto = (info.assessoria.data && info.assessoria.data.totalPrevisto) || 0;
        title = [
          `Título/Assessoria: ${info.assessoria.nome}`,
          `Local/Município: ${info.assessoria.municipio || '—'}`,
          `Horas Totais: ${totalPrevisto}h`,
          `Horário: 08h00 - 17h00`,
          `Carga horária: ${info.horas}h`,
          `Deslocamento por dia: 00`,
          `Consultores: A definir`
        ].join('\n');
      } else if (comp) {
        cls += ' cal-compensacao';
        title = `Compensação${comp.motivo ? ': ' + comp.motivo : ''}`;
      }
      return `<div class="${cls}" ${style} data-date="${iso}" data-clickable title="${escapeAttr(title)}">${d}</div>`;
    }).join('');
    return `<div class="cal-month">
        <div class="cal-month-title">${MONTH_NAMES[month]} ${year}</div>
        <div class="cal-grid cal-grid-head">${WEEKDAY_LABELS.map(w=>`<div class="cal-cell cal-head">${w}</div>`).join('')}</div>
        <div class="cal-grid">${cellsHtml}</div>
      </div>`;
  }

  function renderCalendario(){
    document.getElementById('ano-atual-label').textContent = calendarYear;
    const legenda = document.getElementById('calendario-legenda');
    legenda.innerHTML = ownedAssessoriasSorted.map((a,i) => `<span><i style="background:${colorForIndex(i)}"></i>${a.nome}</span>`).join('')
      + `<span><i style="background:#ede9fe"></i>Compensação</span>`;
    const meses = document.getElementById('calendario-meses');
    let html = '';
    for (let m = 0; m < 12; m++) html += renderMesConsolidado(calendarYear, m);
    meses.innerHTML = html;
    meses.querySelectorAll('[data-date]').forEach(el => {
      el.addEventListener('click', () => onCalendarioClick(el.dataset.date));
    });
  }

  async function onCalendarioClick(iso){
    const info = consolidatedDayInfo(iso);
    if (info) {
      if (info.tipo === 'realizada') {
        const result = await showActionPanel({
          title: fmtDateBR(iso),
          subtitle: `"${info.assessoria.nome}" já tem uma visita registrada nesse dia (${info.horas}h).`,
          actions: [
            { label:'Abrir essa assessoria', style:'primary', value:'abrir' },
            { label:'Fechar', style:'ghost', value:'fechar' }
          ]
        });
        if (result && result.action === 'abrir') window.location.href = `dashboard.html?id=${info.assessoria.id}`;
        return;
      }
      // planejada, ainda não realizada
      const result = await showActionPanel({
        title: fmtDateBR(iso),
        subtitle: `"${info.assessoria.nome}" está planejada para esse dia (${info.horas}h).`,
        actions: [
          { label:'Reagendar para outra data', style:'primary', value:'reagendar' },
          { label:'Remover planejamento', style:'danger', value:'remover' },
          { label:'Cancelar', style:'ghost', value:'cancel' }
        ]
      });
      if (!result || result.action === 'cancel') return;
      if (result.action === 'reagendar') {
        await reagendarEntradaPainel(info.assessoria, info.entrada, iso);
        return;
      }
      const confirmado = await showActionPanel({
        title: 'Remover planejamento?',
        subtitle: `${fmtDateBR(iso)} · "${info.assessoria.nome}" · ${info.horas}h`,
        actions: [
          { label:'Remover', style:'danger', value:'sim' },
          { label:'Cancelar', style:'ghost', value:'nao' }
        ]
      });
      if (confirmado && confirmado.action === 'sim') await removerPlanejamentoPainel(info.assessoria, iso);
      return;
    }
    const comp = compensacaoNoDia(iso);
    if (comp) {
      const confirmado = await showActionPanel({
        title: 'Remover compensação?',
        subtitle: `${fmtDateBR(iso)}${comp.motivo ? ' — ' + comp.motivo : ''}`,
        actions: [
          { label:'Remover', style:'danger', value:'sim' },
          { label:'Cancelar', style:'ghost', value:'nao' }
        ]
      });
      if (confirmado && confirmado.action === 'sim') {
        await sb.from('compensacoes').delete().eq('id', comp.id);
        compensacoesList = compensacoesList.filter(c => c.id !== comp.id);
        renderCalendario();
      }
      return;
    }
    const result = await showActionPanel({
      title: 'Marcar compensação',
      subtitle: fmtDateBR(iso),
      fields: [{ id:'motivo', label:'Motivo (opcional)', type:'text', placeholder:'Ex.: banco de horas' }],
      actions: [
        { label:'Marcar compensação', style:'primary', value:'ok' },
        { label:'Cancelar', style:'ghost', value:'cancel' }
      ]
    });
    if (!result || result.action !== 'ok') return;
    const { data: novaComp, error } = await sb.from('compensacoes').insert({
      owner_id: session.user.id,
      data_iso: iso,
      motivo: result.values.motivo.trim() || null
    }).select().single();
    if (error) { alert('Não foi possível marcar a compensação: ' + error.message); return; }
    compensacoesList.push(novaComp);
    renderCalendario();
  }

  function planningBlockReasonPainel(iso, assessoriaAtualId){
    const info = consolidatedDayInfo(iso);
    if (info && info.assessoria.id !== assessoriaAtualId) return `Você já está na assessoria "${info.assessoria.nome}" nesse dia (${info.horas}h).`;
    if (info && info.assessoria.id === assessoriaAtualId) return 'Já existe uma visita planejada ou registrada nessa data, nessa mesma assessoria.';
    const comp = compensacaoNoDia(iso);
    if (comp) return `Esse dia está marcado como compensação${comp.motivo ? ' ('+comp.motivo+')' : ''}.`;
    return null;
  }

  async function reagendarEntradaPainel(assessoria, entrada, deISO){
    const result = await showActionPanel({
      title: 'Reagendar visita',
      subtitle: `"${assessoria.nome}" · de ${fmtDateBR(deISO)} · ${entrada.horas}h`,
      fields: [{ id:'data', label:'Nova data', type:'text', value: fmtDateBR(deISO), placeholder:'DD/MM/AAAA' }],
      actions: [
        { label:'Reagendar', style:'primary', value:'ok' },
        { label:'Cancelar', style:'ghost', value:'cancel' }
      ]
    });
    if (!result || result.action !== 'ok') return;
    const novaISO = parseBRDateToISO(result.values.data);
    if (!novaISO) { alert('Data inválida. Use o formato DD/MM/AAAA.'); return; }
    if (novaISO === deISO) return;
    const motivoBloqueio = planningBlockReasonPainel(novaISO, assessoria.id);
    if (motivoBloqueio) { alert(`Não é possível reagendar para essa data: ${motivoBloqueio}`); return; }

    const novaData = JSON.parse(JSON.stringify(assessoria.data));
    const alvo = (novaData.visitasPlanejadas||[]).find(p => p.id === entrada.id);
    if (!alvo) return;
    alvo.dataISO = novaISO;
    novaData.visitasPlanejadas.sort((a,b) => a.dataISO.localeCompare(b.dataISO));

    const { data: updated, error } = await sb.from('assessorias')
      .update({ data: novaData })
      .eq('id', assessoria.id)
      .eq('updated_at', assessoria.updated_at)
      .select('updated_at')
      .maybeSingle();
    if (error) { alert('Não foi possível reagendar: ' + error.message); return; }
    if (!updated) { alert('Essa assessoria foi alterada em outro lugar enquanto você editava. Atualize a página e tente de novo.'); return; }
    assessoria.data = novaData;
    assessoria.updated_at = updated.updated_at;
    renderCalendario();
  }

  async function removerPlanejamentoPainel(assessoria, iso){
    const novaData = JSON.parse(JSON.stringify(assessoria.data));
    novaData.visitasPlanejadas = (novaData.visitasPlanejadas||[]).filter(p => p.dataISO !== iso);
    const { data: updated, error } = await sb.from('assessorias')
      .update({ data: novaData })
      .eq('id', assessoria.id)
      .eq('updated_at', assessoria.updated_at)
      .select('updated_at')
      .maybeSingle();
    if (error) { alert('Não foi possível remover: ' + error.message); return; }
    if (!updated) { alert('Essa assessoria foi alterada em outro lugar enquanto você editava. Atualize a página e tente de novo.'); return; }
    assessoria.data = novaData;
    assessoria.updated_at = updated.updated_at;
    renderCalendario();
  }

  document.getElementById('btn-ano-anterior').addEventListener('click', () => { calendarYear--; renderCalendario(); });
  document.getElementById('btn-ano-seguinte').addEventListener('click', () => { calendarYear++; renderCalendario(); });

  document.getElementById('btn-nova').addEventListener('click', () => {
    editingAssessoriaId = null;
    document.getElementById('modal-nova-titulo').textContent = 'Nova assessoria';
    document.getElementById('btn-salvar-nova').textContent = 'Criar assessoria';
    document.getElementById('form-nova').reset();
    document.getElementById('modal-nova').classList.remove('hidden');
  });
  document.getElementById('btn-cancelar-nova').addEventListener('click', closeNovaModal);
  document.getElementById('form-nova').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const nome = document.getElementById('nova-nome').value.trim();
    const cliente_nome = document.getElementById('nova-cliente').value.trim();
    const municipio = document.getElementById('nova-municipio').value.trim();
    const proposta = document.getElementById('nova-proposta').value.trim();

    if (editingAssessoriaId) {
      const { error } = await sb.from('assessorias').update({
        nome,
        cliente_nome: cliente_nome || null,
        municipio: municipio || null,
        proposta: proposta || null
      }).eq('id', editingAssessoriaId);
      if (error) { alert('Não foi possível salvar as alterações: ' + error.message); return; }
      closeNovaModal();
      loadAssessorias();
      return;
    }

    const { data, error } = await sb.from('assessorias').insert({
      owner_id: session.user.id,
      nome,
      cliente_nome: cliente_nome || null,
      municipio: municipio || null,
      proposta: proposta || null,
      data: defaultState()
    }).select().single();
    if (error) { alert('Não foi possível criar a assessoria: ' + error.message); return; }
    document.getElementById('modal-nova').classList.add('hidden');
    document.getElementById('form-nova').reset();
    window.location.href = `dashboard.html?id=${data.id}`;
  });

  (async () => {
    session = await requireSession();
    if (!session) return;
    document.getElementById('user-email').textContent = session.user.email;
    loadAssessorias();
  })();
</script>
</body>
</html>
